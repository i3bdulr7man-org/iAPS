name: 6. Daily Upstream Sync
run-name: Daily Upstream Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Artificial-Pancreas/iAPS.git
          git fetch upstream

      - name: Merge upstream dev into my-branch
        run: |
          git checkout my-branch
          git merge upstream/dev --no-edit || true

      - name: Push changes if needed
        run: |
          # تحقّق من وجود تغييرات
          if git diff --quiet; then
            echo "No changes detected. Skipping push."
          else
            echo "Changes detected. Pushing..."
            git push origin my-branch
          fi
